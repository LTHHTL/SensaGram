name: Build SensaGram Debug APK
# 触发规则：
# 1. 推送v开头tag自动打包并生成Release
# 2. 可以在Actions页面手动点击Run workflow触发构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17（SensaGram使用JDK17）
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 赋予gradlew执行权限
        run: chmod +x ./gradlew

      - name: Gradle缓存，加速后续编译
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ github.sha }}

      - name: 编译Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 【调试阶段】先上传artifact，可以在Actions页面直接下载apk，不生成Release
      - name: Upload APK to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensagram-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 只有tag推送时，才自动新建Release并挂载apk
      - name: Create Release & attach APK
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SensaGram Custom Build ${{ github.ref_name }}
          body: |
            Custom modified SensaGram (added custom button & UDP fields)
            Debug build, no official signature.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
